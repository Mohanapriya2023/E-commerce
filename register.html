<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - E-Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Simple Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fs-4 fw-bold" href="index.html" style="text-decoration: none; color: #e63946;">
                <i class="fas fa-shopping-bag me-2 fs-3"></i> E-Shop
            </a>
        </div>
    </nav>

    <!-- Register Form -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-plus fs-1 text-danger mb-2"></i>
                            <h3 class="fw-bold">Create an Account</h3>
                            <p class="text-muted">Register to start shopping</p>
                        </div>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control form-control-lg" id="regName" placeholder="Enter your name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Email address</label>
                                <input type="email" class="form-control form-control-lg" id="regEmail" placeholder="Enter your email" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="regPassword" placeholder="Create password" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold rounded-pill">Register</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-muted">Already have an account? <a href="login.html" class="text-danger fw-bold">Login here</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;

            // 1. Get existing users from localStorage (or create an empty array)
            let usersDB = JSON.parse(localStorage.getItem('usersDB')) || [];

            // 2. Check if the email is already registered
            const userExists = usersDB.find(user => user.email === email);
            if (userExists) {
                alert("This email is already registered. Please login.");
                return;
            }

            // 3. Create a new user object with a unique ID
            const newUser = {
                id: 'U' + Math.floor(Math.random() * 100000), // Generate a random ID
                name: name,
                email: email,
                password: password
            };

            // 4. Save the new user to the database
            usersDB.push(newUser);
            localStorage.setItem('usersDB', JSON.stringify(usersDB));

            // 5. Redirect to login
            alert("Registration successful! Please login now.");
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
