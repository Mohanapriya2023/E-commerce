<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - E-Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <!-- Simple Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center fs-4 fw-bold" href="index.html" style="text-decoration: none; color: #e63946;">
                <i class="fas fa-shopping-bag me-2 fs-3"></i> E-Shop
            </a>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-5">
                        <div class="text-center mb-4">
                            <i class="fas fa-user-circle fs-1 text-danger mb-2"></i>
                            <h3 class="fw-bold">Welcome Back</h3>
                            <p class="text-muted">Sign in to your account</p>
                        </div>
                        
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Full Name</label>
                                <input type="text" class="form-control form-control-lg" id="name" placeholder="Enter your name" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Password</label>
                                <input type="password" class="form-control form-control-lg" id="password" placeholder="Enter password" required>
                            </div>
                            <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold rounded-pill">Login</button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-muted">Don't have an account? <a href="register.html" class="text-danger fw-bold">Register here</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Ensure a default admin exists for testing if DB is empty
        if (!localStorage.getItem('usersDB')) {
            const defaultUsers = [{ id: "U001", name: "Admin", email: "admin@shop.com", password: "admin" }];
            localStorage.setItem('usersDB', JSON.stringify(defaultUsers));
        }

        // 2. Handle Login Submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const password = document.getElementById('password').value.trim();
            
            // Get registered users
            const usersDB = JSON.parse(localStorage.getItem('usersDB')) || [];

            // Find matching user (case-insensitive name)
            const user = usersDB.find(u => u.name.toLowerCase() === name.toLowerCase() && u.password === password);

            if (user) {
                // Login Successful
                localStorage.setItem('loggedInUserId', user.id);
                localStorage.setItem('loggedInUserName', user.name);
                
                alert(`Welcome back, ${user.name}!`);
                
                // Redirect to home or previous page
                const redirectUrl = localStorage.getItem('redirectAfterLogin');
                if (redirectUrl) {
                    localStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = 'index.html'; 
                }
            } else {
                alert("Invalid Name or Password. Please try again or register.");
            }
        });
    </script>
</body>
</html>
