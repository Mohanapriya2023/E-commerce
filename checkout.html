    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-lg">
    <div class="container-fluid px-4">
        
        <!-- Brand Logo -->
        <a class="navbar-brand d-flex align-items-center fs-4 me-4 fw-bold" href="index.html" style="color: #febd69;">

        </a>
        
        <!-- Mobile Toggler -->
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            
            <!-- ONE SINGLE LINE: No 'me-auto', no split -->
            <ul class="navbar-nav align-items-center">
                
                <li class="nav-item"><a class="nav-link text-white" href="index.html">Home</a></li>

                <li class="nav-item">

                <li class="nav-item ms-3">

                <li class="nav-item ms-3" id="nav-billing-item" style="display: none;">

                    <a class="nav-link d-flex align-items-center text-white nav-icon-hover" href="wishlist.html">

    <!-- Main Checkout Area -->
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-warning text-dark py-3 rounded-top-4">
                        <h4 class="mb-0 fw-bold"><i class="fas fa-file-invoice-dollar me-2"></i> Billing & Checkout</h4>
                    </div>
                    <div class="card-body p-5">
                        <form id="checkout-form">
                            
                            <!-- Shipping Details -->
                            <h5 class="mb-3 fw-bold text-secondary">1. Shipping Details</h5>
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control" id="bill-name" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold" >Phone Number</label>
                                    <input type="tel" class="form-control" id="bill-phone"  minlength="10" placeholder="+91 9876543210" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-bold">Full Address</label>
                                <textarea class="form-control" id="bill-address" rows="3" minlength="10" maxlength="50"placeholder="House No, Street, City, Pincode" required></textarea>
                            </div>

                            <!-- Payment Method -->
                            <h5 class="mb-3 fw-bold text-secondary">2. Payment Method</h5>
                            <div class="mb-4">
                                <div class="form-check p-3 border rounded mb-2">
                                    <input class="form-check-input" type="radio" name="payment" id="cod" value="COD" checked>
                                    <label class="form-check-label fw-bold" for="cod">
                                        <i class="fas fa-money-bill-wave text-success me-2"></i> Cash on Delivery
                                    </label>
                                </div>
                                <div class="form-check p-3 border rounded">
                                    <input class="form-check-input" type="radio" name="payment" id="card" value="Card">
                                    <label class="form-check-label fw-bold" for="card">
                                        <i class="fas fa-credit-card text-primary me-2"></i> Credit / Debit Card
                                    </label>
                                </div>
                            </div>

                            <!-- Place Order Button -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-warning btn-lg fw-bold rounded-pill py-3">
                                    Place Order <i class="fas fa-check-circle ms-2"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/script.js"></script>

        <!-- Checkout Page Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Security Check: Enforce Login
            const userId = localStorage.getItem('loggedInUserId');
            if (!userId) {
                alert("You must be logged in to view the Billing page.");
                localStorage.setItem('checkoutRedirect', 'checkout.html'); 
                window.location.href = 'login.html'; 
                return; 
            }

            // 2. Auto-fill Name
            const loggedInName = localStorage.getItem('loggedInUserName');
            if (loggedInName) {
                document.getElementById('bill-name').value = loggedInName;
            }
        });

        // 3. Handle Form Submission
        document.getElementById('checkout-form').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page reload
            
            // --- FIX: Get the user-specific cart key ---
            const cartKey = typeof getUserKey === 'function' ? getUserKey('cart') : 'cart';
            const cart = JSON.parse(localStorage.getItem(cartKey)) || [];
            
            if(cart.length === 0) {
                alert("Your cart is empty! Please add items first.");
                window.location.href = 'product.html';
                return;
            }

            // Calculate Total
            let totalAmount = 0;
            cart.forEach(item => {
                totalAmount += (item.price * item.qty);
            });

            // Get Form Data
            const name = document.getElementById('bill-name').value;
            const phone = document.getElementById('bill-phone').value;
            const address = document.getElementById('bill-address').value;
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;

            // Create Order Object
            const newOrder = {
                orderId: 'ORD-' + Math.floor(Math.random() * 1000000),
                userId: localStorage.getItem('loggedInUserId'),
                date: new Date().toLocaleString(),
                customerName: name,
                phone: phone,
                address: address,
                payment: paymentMethod,
                items: cart,
                total: totalAmount.toFixed(2)
            };
            
            // Save to Order History
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            
            // --- FIX: Clear the user-specific cart ---
            localStorage.setItem(cartKey, JSON.stringify([]));
            
            // Update Navbar Count
            if (typeof updateUI === 'function') {
                updateUI(); 
            }
            
            // Success Message & Redirect
            alert(`Order Placed Successfully!\nOrder ID: ${newOrder.orderId}\nTotal: ₹${newOrder.total}`);
            window.location.href = 'orders.html';
        });
    </script>
</body>
</html>
